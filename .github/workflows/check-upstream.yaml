name: Check upstream

on:
  schedule:
    - cron: "20 7,18 * * *"
  workflow_dispatch:

permissions: {}

cache-mode: none

concurrency:
  group: check-upstream
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  branches:
    name: List branches
    permissions:
      contents: read
    runs-on: ubuntu-26.04 # https://github.com/actions/runner-images
    timeout-minutes: 10
    outputs:
      branches: ${{ steps.branches.outputs.branches }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: List main, the maintenance and the major release branches
        id: branches
        run: |
          git branch --remotes --format='%(refname:lstrip=3)' | grep -xE 'main|v[0-9]+\.x|release/v[0-9]+\.0' \
            | jq -Rnc '"branches=\([inputs])"' -r >> "$GITHUB_OUTPUT"

  check:
    name: Check cloudflared releases (${{ matrix.branch }})
    needs: branches
    permissions:
      actions: write # start the build workflow on the branch of the pull request
      contents: write # push the branch of the pull request
      pull-requests: write # open the pull request
    runs-on: ubuntu-26.04 # https://github.com/actions/runner-images
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.branches.outputs.branches) }}
    steps:
      - name: Check out the branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false

      - name: Check GitHub and pin a new cloudflared release
        env:
          GH_TOKEN: ${{ github.token }}
        run: DIFF_FILE="$RUNNER_TEMP/build.diff" scripts/check-upstream.sh

      - name: Open a pull request for the new release
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ matrix.branch }}
        run: |
          git diff --quiet && exit 0
          pin() { jq -r ".cloudflared.latest.$1"; }
          current="$(git show HEAD:src/upstream.json | pin version)"
          version="$(pin version < src/upstream.json)"
          commit="$(pin commit < src/upstream.json)"
          branch="feat/cloudflared-v$version"
          [ "$BASE" = main ] || branch="$branch-${BASE//\//-}"
          title="feat(release): bump cloudflared version from v$current to v$version"
          if [ -n "$(gh pr list --head "$branch" --json number --jq '.[0].number')" ]; then
            echo "a pull request from $branch is open already"
            exit 0
          fi
          cat > "$RUNNER_TEMP/body.md" <<BODY
          Updates cloudflared to v$version, see its [release notes](https://github.com/cloudflare/cloudflared/releases/tag/$version) and its [release commit](https://github.com/cloudflare/cloudflared/commit/$commit).

          ## Changes

          - Bump cloudflared version from v$current to v$version

          BODY
          if [ -s "$RUNNER_TEMP/build.diff" ]; then
            cat >> "$RUNNER_TEMP/body.md" <<NOTE
          > [!NOTE]
          > The build files of cloudflared changed from v$current to v$version, check the go build in \`src/Dockerfile\` against them:
          >
          > \`\`\`diff
          $(sed 's/^/> /' "$RUNNER_TEMP/build.diff")
          > \`\`\`

          NOTE
          fi
          cat >> "$RUNNER_TEMP/body.md" <<BODY
          > [!IMPORTANT]
          > Squash merge this PR to keep the commit history clean.
          BODY
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"
          git commit --all --quiet --message "$title"
          git push --quiet --set-upstream origin "$branch"
          new_pr="$(gh pr create --base "$BASE" --head "$branch" --title "$title" --label bot/upstream --body-file "$RUNNER_TEMP/body.md")"
          gh workflow run build.yaml --ref "$branch"
          for open_pr in $(gh pr list --label bot/upstream --base "$BASE" --json url,title | jq -r --arg from "from v$current to" '.[] | select(.title | contains($from)) | .url'); do
            [ "$open_pr" = "$new_pr" ] || gh pr close "$open_pr" --delete-branch --comment "Superseded by $new_pr"
          done
